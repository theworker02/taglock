name: Finalize TagLock v0.2.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-v0.2.0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Verify source
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go test ./...
          go test -race ./...
          go vet ./...
          go build ./cmd/taglock
          go run ./cmd/taglock check --fail-on error ./...
      - name: Remove one-time workflow and tag clean source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/finalize-v0.2.0.yml
          git add -A
          git commit -m "Prepare TagLock v0.2.0 release"
          git push origin HEAD:main
          git tag -a v0.2.0 -m "TagLock v0.2.0"
          git push origin v0.2.0
      - name: Build release archives
        run: |
          set -euo pipefail
          mkdir -p dist stage
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            rm -rf stage/*
            NAME=taglock
            if [ "$GOOS" = windows ]; then NAME=taglock.exe; fi
            GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags "-s -w" -o "stage/$NAME" ./cmd/taglock
            BASE="taglock_0.2.0_${GOOS}_${GOARCH}"
            if [ "$GOOS" = windows ]; then
              (cd stage && zip -q "../dist/${BASE}.zip" "$NAME")
            else
              tar -czf "dist/${BASE}.tar.gz" -C stage "$NAME"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0 dist/* \
            --verify-tag \
            --title "TagLock v0.2.0" \
            --notes-file docs/releases/v0.2.0.md
